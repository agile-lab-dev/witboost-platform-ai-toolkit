apiVersion: scaffolder.backstage.io/v1beta3 # this is static. it is always this one for a creation template (i.e. template.yaml with kind Template)
kind: Template
metadata:
  name: data-product-template.0 # this is the unique identifier for the template in witboost
  title: Data Product # this is the human-readable title for the template visible in the Witboost UI
  description: Create a new Data Product system # this describes the purpose of the template in the Witboost UI. Must be a clear, concise, one-phrase, catchy description that helps the user understand what this template is for
  mesh:
    icon: https://cdn-icons-png.flaticon.com/512/589/589598.png # this may vary by the specific type of system or project you are creating
  tags: # these are the tags used for classification and search within the Witboost UI
    - data-product 
    - system
  annotations:
    backstage.io/techdocs-ref: dir:.

spec:
  generates: systemtype:default/dataproduct # This may vary according to the Practice Shaper configuration and what type of system you are creating with this template
  owner: witboost
  type: dataproduct # this specifies the type of system being created with this template. make it match the "generates" field's last segment
  parameters:
    - title: Data Product Information # title of the step
      required: # mandatory fields. if users do not provide these, the form will block the user from proceeding
        - name
        - domain
        - identifier
        - description
        - projectOwner
        - developmentGroup
      properties:
        name: # always required by every Witboost project
          title: Name
          
          type: string
          description: Data Product name # "Data Product" may vary according to the specific context or terminology used in your organization. Same for all other fields in this example template
        domain: # always required by every Witboost project 
          title: Domain
          type: string
          description: Domain this Data Product belongs to 
          ui:field: EntityPicker
          ui:options:
            allowArbitraryValues: false
            allowedKinds:
              - Domain

        domainName:
          type: string
          ui:field: EntitySelectionPicker
          ui:fieldName: domain
          ui:property: spec.mesh.name
          ui:options:
            allowArbitraryValues: false
          ui:widget: hidden # the hidden field is a pattern used to retrieve the domain name associated with the selected domain entity above. it's hidden because it's a data field not meant for direct user input.

        identifier: # always required by every Witboost project
          title: Identifier
          type: string
          description: Autogenerated unique identifier.
          ui:field: IdentifierPicker
          ui:options:
            allowArbitraryValues: false
        
        description:
          title: Description
          type: string
          description: Description of purpose and scope of this Data Product

        projectOwner: # always required by every Witboost project
          title: Data Product Owner # may vary according to the specific context or terminology used in your organization.
          type: string
          description: Responsible person for the Data Product from a business perspective
          ui:field: EntityPicker
          ui:options:
            allowArbitraryValues: false
            allowedKinds:
              - User
        developmentGroup: # always required by every Witboost project
          title: Development Group # may vary according to the specific context or terminology used in your organization.
          type: string
          description: Group of developers with access to the Data Product repositories.
          ui:field: EntityPicker
          ui:options:
            allowArbitraryValues: false
            allowedKinds:
              - Group
        email:
          title: Support Contact Email
          type: string
          format: email
          description: Point of contact for support requests.

        tags:
          title: Tags
          type: array
          description: Tags for classification and search.
          default: []
          items:
            type: string

    # You can always add additional steps here as needed.
    # The more steps you add, the more complex your project setup can become and the user may lose track of the overall flow.
    # Tipically, in a creation template you want to be as concise and straightforward as possible. More complex steps can be presented in the edit template
    - title: Additional step
      properties:
        exampleProperty:
          title: Example Property
          type: string
          description: An example property for the additional step.
  steps:
    # Fetch the project skeleton and apply the template, using Nunjucks rendering, to the skeleton directory. This is almost always the first step in every template because it sets up the initial project structure and applies the user-defined values.
    - id: template
      name: Fetch Skeleton + Template
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: .
        values:
          name: ${{ parameters.name }}
          domain: ${{ parameters.domain }}
          domainName: ${{ parameters.domainName }}
          identifier: ${{ parameters.identifier }}
          description: ${{ parameters.description }}
          projectOwner: ${{ parameters.projectOwner }}
          developmentGroup: ${{ parameters.developmentGroup }}
          email: ${{ parameters.email }}
          tags: ${{ parameters.tags }}
          useCaseTemplateId: urn:dmb:utm:data-product-template:0.0.0 # this is the unique identifier of the template but in URN format
          infrastructureTemplateId: urn:dmb:itm:data-product-tech-adapter:0 # this is the unique identifier for the tech adapter responsible of the provisioning of projects created by this template in witboost
          useCaseTemplateVersion: 0.0.0
          repoName: wit-dp-${{ parameters.domain | replace(r/domain:| |-/, "") }}-${{ parameters.name.split(" ") | join("") | lower }} # e.g. wit-dp-finance-transactions <- this is a naming convention that every customer must define when creating their first project template. "dp" stands for data product. so this may change 

  # ──────────────────────────────────────────────────────────
  # choose ONE publish variant matching your Git provider.
  # Below shows all three; keep only the one you need.
  # ──────────────────────────────────────────────────────────

    # ── GitLab ──
    - id: publish
      name: Publish
      action: witboostMeshComponent:publish:gitlab
      input:
        allowedHosts:
          - gitlab.com
        description: ${{ parameters.name }}
        repoUrl: gitlab.com?owner=my-org&repo=wit-dp-${{ parameters.domain | replace(r/domain:| |-/, "") }}-${{ parameters.name.split(" ") | join("") | lower }} # same reasoning as above. moreover, owner should match the group where the repository will be created. this is a detail that must be asked to customer
        rootDirectory: .
        dataproduct: ${{ parameters.name }}

    # ── GitHub ──
    # - id: publish
    #   name: Publish
    #   action: witboostMeshComponent:publish:github
    #   input:
    #     allowedHosts:
    #       - github.com
    #     description: ${{ parameters.name }}
    #     repoUrl: github.com?owner=my-org&repo=wit-dp-${{ parameters.domain | replace(r/domain:| |-/, "") }}-${{ parameters.name.split(" ") | join("") | lower }} # same reasoning as above. moreover, owner should match the group where the repository will be created. this is a detail that must be asked to customer
    #     rootDirectory: .
    #     parentRef: ${{ parameters.name }}

    # ── Azure DevOps ──
    # - id: publish
    #   name: Publish
    #   action: witboostMeshComponent:publish:azure
    #   input:
    #     allowedHosts:
    #       - dev.azure.com
    #     description: ${{ parameters.name }}
    #     repoUrl: dev.azure.com?organization=my-org&owner=my-project&repo=wit-dp-${{ parameters.domain | replace(r/domain:| |-/, "") }}-${{ parameters.name.split(" ") | join("") | lower }} # same reasoning as above. moreover, owner should match the group where the repository will be created. this is a detail that must be asked to customer
    #     rootDirectory: .
    #     dataproduct: ${{ parameters.name }}
    #     defaultBranch: dev

    # ── BitBucket Server ──
    # - id: publish
    #   name: Publish
    #   action: witboostMeshComponent:publish:bitbucket
    #   input:
    #     allowedHosts:
    #       - bitbucket.org
    #     description: ${{ parameters.name }}
    #     repoUrl: bitbucket.org?owner=my-org&repo=wit-dp-${{ parameters.domain | replace(r/domain:| |-/, "") }}-${{ parameters.name.split(" ") | join("") | lower }} # same reasoning as above. moreover, owner should match the group where the repository will be created. this is a detail that must be asked to customer
    #     rootDirectory: .
    #     dataproduct: ${{ parameters.name }}

    # The register step is responsible for registering the newly created project in Witboost by providing the URL to the catalog-info.yaml file 
    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  # the output section defines the links and references that will be displayed to the user after the template execution. most of the times we are fine with these default links
  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open Project in Witboost
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
