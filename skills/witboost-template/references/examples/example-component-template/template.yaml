apiVersion: scaffolder.backstage.io/v1beta3 # this is static. it is always this one for a creation template (i.e. template.yaml with kind Template)
kind: Template
metadata:
  name: example-component-template.0 # this is the unique identifier for the template in witboost. for components, convention is {technology}-{component-type}-template.{version}
  title: Example Component # this is the human-readable title for the template visible in the Witboost UI. Most always the title reflects the underlying technology e.g. Snowflake Output Port
  description: Create a new Component # this describes the purpose of the template in the Witboost UI. Must be a clear, concise, one-phrase, catchy description that helps the user understand what this template is for. Usually the name resembles the underlying technology e.g. Create Snowflake Output Port
  mesh:
    icon: https://cdn-icons-png.flaticon.com/512/3953/3953226.png # this may vary by the specific type of component you are creating (output port, workload, storage, etc.)
  tags: # these are the tags used for classification and search within the Witboost UI
    - component
  annotations:
    backstage.io/techdocs-ref: dir:.

spec:
  generates: componenttype:default/outputport # This may vary according to the Practice Shaper configuration and the type of component you are creating. Common values: componenttype:default/outputport, componenttype:default/workload, componenttype:default/storage
  owner: witboost
  type: outputport # this specifies the type of component being created with this template. make it match the "generates" field's last segment (e.g. outputport, workload, storage)
  parameters:
    - title: Component Metadata # title of the step
      description: General information about the Component
      type: object
      required: # mandatory fields. if users do not provide these, the form will block the user from proceeding
        - name
        - domain
        - dataproduct
        - description
      properties:
        name: # always required by every Witboost component
          title: Name
          type: string
          description: Display name of the Component. # may vary according to the specific context or terminology used in your organization. Same for all other fields in this example template
          ui:field: EntityNamePicker # for components, use EntityNamePicker (not a plain string). this provides autocomplete and validation for entity names
          default: My Component # optional default value to help the user
          ui:options:
            allowArbitraryValues: true
        domain: # always required by every Witboost component
          title: Domain
          type: string
          description: Domain of the parent Data Product. # "Data Product" may vary according to the specific context or terminology used in your organization
          ui:field: EntityPicker
          ui:options:
            allowArbitraryValues: false
            allowedKinds:
              - Domain
        dataproduct: # always required by every Witboost component. this links the component to its parent system (Data Product)
          title: Data Product
          type: string
          description: Data Product this Component belongs to. # "Data Product" may vary according to the specific context or terminology used in your organization
          ui:field: EntityPicker
          ui:filter: # this filter ensures only Data Products belonging to the selected domain are shown
            - fieldName: domain
              entityPath: spec.domain
          ui:options:
            allowArbitraryValues: false
            allowedKinds:
              - System
        dataProductRepo:
          title: Data Product Repository
          type: string
          description: DPAT Configuration artifact will be created into this repository
          ui:field: EntitySelectionPicker
          ui:fieldName: dataproduct
          ui:property: metadata.annotations["witboost.com/repo-name"]
          ui:options:
            allowArbitraryValues: false
        identifier: # always required by every Witboost component. auto-generated, not user-editable
          title: Identifier
          type: string
          description: Autogenerated unique identifier. Not editable after creation.
          ui:field: ComponentIdentifierPicker # for components, always use ComponentIdentifierPicker (not IdentifierPicker which is for projects)
          ui:options:
            allowArbitraryValues: false
        owner: # always required by every Witboost component. auto-selected from the parent Data Product, so the user does not need to pick it manually
          title: Component Owner
          type: string
          description: Automatically selected from the Data Product metadata.
          ui:field: EntitySelectionPicker # this picker auto-retrieves the owner from the selected Data Product
          ui:fieldName: dataproduct
          ui:property: spec.owner
          ui:options:
            allowArbitraryValues: false
        description:
          title: Description
          type: string
          description: Description of purpose and scope of this Component.
        dependsOn: # always present in every Witboost component. allows the user to declare dependencies on other components within the same Data Product
          title: Depends on
          type: array
          default: []
          items:
            type: string
            ui:field: EntityComponentsPicker # this picker shows only components belonging to the same Data Product
            ui:fieldName: dataproduct
            ui:options:
              allowArbitraryValues: false
        tags:
          title: Tags
          type: array
          description: Tags for classification and search.
          default: []
          items:
            type: string

    # You can always add additional steps here as needed.
    # The more steps you add, the more complex your component setup can become and the user may lose track of the overall flow.
    # Typically, in a creation template you want to be as concise and straightforward as possible. More complex steps can be presented in the edit template.
    # Below is an example additional step. Replace it with the fields your tech adapter needs.
    - title: Additional Configuration
      description: Technology-specific configuration for this Component.
      properties:
        exampleProperty:
          title: Example Property
          type: string
          description: An example property for the additional step. Replace with tech-adapter-specific fields.

  steps:
    # Fetch the component skeleton and apply the template, using Nunjucks rendering, to the skeleton directory.
    # For components, targetPath places the component inside a subdirectory of the Data Product's monorepo.
    - id: template
      name: Fetch Skeleton + Template
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: &rootDirectory ./components/${{ parameters.name | replace(r/ /, "") | lower }} # monorepo convention: component goes into a subdirectory under components/
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          domain: ${{ parameters.domain }}
          dataproduct: ${{ parameters.dataproduct }}
          identifier: ${{ parameters.identifier }}
          owner: ${{ parameters.owner }}
          dependsOn: ${{ parameters.dependsOn }}
          tags: ${{ parameters.tags }}
          exampleProperty: ${{ parameters.exampleProperty }}
          useCaseTemplateId: urn:dmb:utm:example-component-template:0.0.0 # this is the unique identifier of the template but in URN format
          infrastructureTemplateId: urn:dmb:itm:example-component-tech-adapter:0 # this is the unique identifier for the tech adapter responsible of the provisioning of the component created by this template in witboost
          useCaseTemplateVersion: 0.0.0

  # ──────────────────────────────────────────────────────────
  # choose ONE publish variant matching your Git provider.
  # Below shows all four; keep only the one you need.
  # ──────────────────────────────────────────────────────────

    # ── GitLab ──
    - id: publish
      name: Publish
      action: witboostMeshComponent:publish:gitlab
      input:
        allowedHosts:
          - gitlab.com
        description: ${{ parameters.description }}
        repoUrl: gitlab.com?owner=my-org&repo=${{ parameters.dataProductRepo }} # my-org must be replaced with the actual GitLab organization that owns the repository. This is a customer-specific detail that must be provided.
        rootDirectory: *rootDirectory
        parentRef: ${{ parameters.dataproduct }} # for components, parentRef links the component to its parent system

    # ── GitHub ──
    # - id: publish
    #   name: Publish
    #   action: witboostMeshComponent:publish:github
    #   input:
    #     allowedHosts:
    #       - github.com
    #     description: ${{ parameters.description }}
    #     repoUrl: github.com?owner=my-org&repo=${{ parameters.dataProductRepo }} # my-org must be replaced with the actual GitHub organization that owns the repository. This is a customer-specific detail that must be provided.
    #     rootDirectory: *rootDirectory
    #     parentRef: ${{ parameters.dataproduct }}

    # ── Azure DevOps ──
    # - id: publish
    #   name: Publish
    #   action: witboostMeshComponent:publish:azure
    #   input:
    #     allowedHosts:
    #       - dev.azure.com
    #     description: ${{ parameters.description }}
    #     repoUrl: dev.azure.com?organization=my-org&owner=my-project&repo=${{ parameters.dataProductRepo }} # organization and owner must be replaced with the actual Azure DevOps organization and project that owns the repository. This is a customer-specific detail that must be provided.
    #     rootDirectory: *rootDirectory
    #     parentRef: ${{ parameters.dataproduct }}
    #     defaultBranch: dev

    # ── BitBucket Server ──
    # - id: publish
    #   name: Publish
    #   action: witboostMeshComponent:publish:bitbucket
    #   input:
    #     allowedHosts:
    #       - bitbucket.org
    #     description: ${{ parameters.description }}
    #     repoUrl: bitbucket.org?owner=my-org&repo=${{ parameters.dataProductRepo }}
    #     rootDirectory: *rootDirectory
    #     parentRef: ${{ parameters.dataproduct }}

    # in case the customer does not want a monorepo setting, i.e. each component has its own repository, the targetPath and rootDirectory would need to be adjusted accordingly.
    # you can see how this is done in the example-project-template, and adapt the naming convention of the repo accordingly e.g. wit-cmp-<domain>-<project-name>-<component-name>

    # The register step is responsible for registering the newly created component in Witboost by providing the URL to the catalog-info.yaml file.
    # In a monorepo setup the component lives in a subdirectory, so we register it via catalogInfoUrl:
    # repoContentsUrl would point at the repo root, i.e. at the Data Product's catalog-info.yaml instead of the component's.
    - id: register
      name: Register
      action: catalog:register
      input:
        catalogInfoUrl: ${{ steps.publish.output.catalogInfoUrl }}

    # If each component has its own repository (no monorepo), use this variant instead:
    # - id: register
    #   name: Register
    #   action: catalog:register
    #   input:
    #     repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
    #     catalogInfoPath: /catalog-info.yaml

  # the output section defines the links and references that will be displayed to the user after the template execution. most of the times we are fine with these default links
  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open Component in Witboost
        icon: catalog
        entityRef: '${{ steps.register.output.entityRef }}'
      - title: Open Project in Witboost
        icon: catalog
        entityRef: '${{ steps.register.output.entityRef.replace("component:", "system:").split(".").slice(0, -1).join(".") }}'
