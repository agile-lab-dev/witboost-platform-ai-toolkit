# GitLab CI/CD for witboost-tech-adapter-ai-toolkit
# Pipeline: quality -> test -> package -> security -> release

stages:
  - quality
  - test
  - package
  - security
  - release

variables:
  NODE_VERSION: "20"
  # Keep npm out of the CI cache key path issues
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # Force colored output for nicer logs
  FORCE_COLOR: "1"

# Cache npm dependencies across jobs/pipelines
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm
  policy: pull-push

.default:
  image: node:${NODE_VERSION}-alpine
  before_script:
    - apk add --no-cache git
    - npm ci --cache .npm --prefer-offline

# ---------------------------------------------------------------------------
# Quality stage
# ---------------------------------------------------------------------------

lint:
  extends: .default
  stage: quality
  script:
    - npm run lint

type-check:
  extends: .default
  stage: quality
  script:
    - npm run check

build:
  extends: .default
  stage: quality
  script:
    - npm run build
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - dist/

# ---------------------------------------------------------------------------
# Test stage
# ---------------------------------------------------------------------------

test:
  extends: .default
  stage: test
  needs:
    - build
  script:
    - npm test

package:
  extends: .default
  stage: package
  needs:
    - build
    - test
  script:
    - npm pack --dry-run

# ---------------------------------------------------------------------------
# Security stage
# ---------------------------------------------------------------------------

audit:
  extends: .default
  stage: security
  script:
    # Fail on high or critical vulnerabilities.
    # Use `--audit-level=critical` to restrict to critical only.
    # Note: this project currently has only devDependencies, so we audit all
    # dependencies (no --omit=dev) to keep coverage meaningful.
    - npm audit --audit-level=high
  allow_failure: false

# ---------------------------------------------------------------------------
# Release stage
# ---------------------------------------------------------------------------

publish:
  extends: .default
  stage: release
  needs:
    - lint
    - type-check
    - build
    - test
    - package
    - audit
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - PACKAGE_VERSION="$(node -p "require('./package.json').version")"
    - test "$CI_COMMIT_TAG" = "v$PACKAGE_VERSION"
    - npm config set @witboost:registry "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
    - npm config set -- "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken" "${CI_JOB_TOKEN}"
    - npm publish

# Validate merge requests and the default branch; validate and publish release tags.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        IS_MERGE_REQUEST: "true"
    - if: $CI_COMMIT_BRANCH == "master"
      variables:
        IS_master: "true"
    - if: $CI_COMMIT_TAG
    - when: never
