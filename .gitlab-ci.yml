# GitLab CI/CD for witboost-tech-adapter-ai-toolkit
# Pipeline: quality -> test -> package -> security

stages:
  - quality
  - test
  - package
  - security

variables:
  NODE_VERSION: "20"
  # Keep npm out of the CI cache key path issues
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # Force colored output for nicer logs
  FORCE_COLOR: "1"

# Cache npm dependencies across jobs/pipelines
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm
  policy: pull-push

.default:
  image: node:${NODE_VERSION}-alpine
  before_script:
    - apk add --no-cache git
    - npm ci --cache .npm --prefer-offline

# ---------------------------------------------------------------------------
# Quality stage
# ---------------------------------------------------------------------------

lint:
  extends: .default
  stage: quality
  script:
    - npm run lint

type-check:
  extends: .default
  stage: quality
  script:
    - npm run check

build:
  extends: .default
  stage: quality
  script:
    - npm run build
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - dist/

# ---------------------------------------------------------------------------
# Test stage
# ---------------------------------------------------------------------------

test:
  extends: .default
  stage: test
  needs:
    - build
  script:
    - npm test

package:
  extends: .default
  stage: package
  needs:
    - build
    - test
  script:
    - npm pack --dry-run

# ---------------------------------------------------------------------------
# Security stage
# ---------------------------------------------------------------------------

audit:
  extends: .default
  stage: security
  script:
    # Fail on high or critical vulnerabilities.
    # Use `--audit-level=critical` to restrict to critical only.
    # Note: this project currently has only devDependencies, so we audit all
    # dependencies (no --omit=dev) to keep coverage meaningful.
    - npm audit --audit-level=high
  allow_failure: false

# Validate merge requests, the default branch, and release tags.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        IS_MERGE_REQUEST: "true"
    - if: $CI_COMMIT_BRANCH == "master"
      variables:
        IS_master: "true"
    - if: $CI_COMMIT_TAG
    - when: never
