name: "witboost-adapter-review"
displayName: "Witboost Adapter Review"
description: >
  Review an existing Witboost tech adapter feature or design: findings by
  severity, missing decisions, missing tests, and compatibility risks. Use to
  check a design or implementation against target-repository evidence before
  or after coding.

tools:
  - read
  - search
  - edit
  - todo

skills:
  - witboost-tech-adapter-ai-toolkit

category: "lifecycle"

handoffs:
  - witboost-adapter-implement

harness:
  copilot:
    command: "witboost-adapter-review"
    argumentHint: >
      Point to the feature, design, or change to review, and the target
      repository it lives in.
  claude:
    subcommand: "witboost-adapter-review"
  codex:
    section: "witboost-adapter-review"
  gemini: {}
