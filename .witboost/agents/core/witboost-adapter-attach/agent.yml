name: "witboost-adapter-attach"
displayName: "Witboost Adapter Attach"
description: >
  Attach the Witboost tech adapter workflow to an existing (or freshly
  bootstrapped) tech adapter repository: reconstruct its lifecycle and
  ownership boundaries from real routes, scripts, tests, and docs. Use when a
  target tech adapter repository already exists and its actual contract needs
  to be reconstructed before any design, review, or implementation.

tools:
  - read
  - search
  - edit
  - todo

skills:
  - witboost-tech-adapter-ai-toolkit

category: "lifecycle"

handoffs:
  - witboost-adapter-high-level-design
  - witboost-adapter-new-feature

harness:
  copilot:
    command: "witboost-adapter-attach"
    argumentHint: >
      Give the target tech adapter repository path or name and the platform it
      wraps.
  claude:
    subcommand: "witboost-adapter-attach"
  codex:
    section: "witboost-adapter-attach"
  gemini: {}
