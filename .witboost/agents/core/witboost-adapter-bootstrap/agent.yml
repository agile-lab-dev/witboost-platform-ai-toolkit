name: "witboost-adapter-bootstrap"
displayName: "Witboost Adapter Bootstrap"
description: >
  Start a brand-new Witboost tech adapter by cloning the Java or Python scaffold
  into its own target repository and stripping git history. Assumes an
  already-installed shared Witboost workspace (see README); only copies
  `.witboost/` and generates harness files locally when standalone/detached
  operation is explicitly requested (--standalone). Use when there is no
  existing tech adapter repository yet and one needs to be created from the
  official scaffold before any design or implementation work.

tools:
  - read
  - search
  - edit
  - execute
  - todo

skills:
  - witboost-tech-adapter-ai-toolkit

category: "lifecycle"

# Bootstrapping only ever runs from this toolkit's own host repo (it invokes
# scripts/bootstrap-new-adapter.sh, which is never copied into a target
# adapter repo) — never generate this agent when setting up a target repo.
hostOnly: true

handoffs:
  - witboost-adapter-attach

harness:
  copilot:
    command: "witboost-adapter-bootstrap"
    argumentHint: >
      Say which scaffold (Java or Python), the target repository path or name,
      and any naming details for the new tech adapter.
  claude:
    subcommand: "witboost-adapter-bootstrap"
  codex:
    section: "witboost-adapter-bootstrap"
  gemini: {}
