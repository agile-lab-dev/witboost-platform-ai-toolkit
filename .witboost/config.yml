# .witboost/config.yml — Witboost Tech Adapter AI Toolkit configuration
# All fields are optional. Defaults shown in comments.

# Harness configuration
harness:
  # Which harness(es) to generate files for
  # Values: copilot, claude, codex, gemini
  # Default: [copilot]
  targets:
    - copilot

# Agent settings
agents:
  # Include custom agents from .witboost/agents/custom/
  # Default: true
  includeCustom: true
